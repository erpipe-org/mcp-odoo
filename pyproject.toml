[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-mcp"
version = "1.4.0"
description = "Odoo MCP for AI agents — 41 tools, gated writes, multi-instance. Free hosted product: ERPipe (erpipe.com)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["odoo", "mcp", "server", "model-context-protocol", "chatgpt", "claude", "erpipe"]
authors = [
    {name = "Lê Anh Tuấn", email = "justin.le.1105@gmail.com"}
]
dependencies = [
    "mcp>=2,<3",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://erpipe-org.github.io/mcp-odoo/"
Source = "https://github.com/erpipe-org/mcp-odoo"
Documentation = "https://github.com/erpipe-org/mcp-odoo#readme"
Changelog = "https://github.com/erpipe-org/mcp-odoo/blob/main/CHANGELOG.md"
Issues = "https://github.com/erpipe-org/mcp-odoo/issues"
Security = "https://github.com/erpipe-org/mcp-odoo/security"
"Hosted (ERPipe)" = "https://erpipe.com/"
"Hosted MCP" = "https://mcp.erpipe.com/mcp"

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "mypy",
    "pytest",
    "ruff",
    "build",
    "twine",
]

[project.scripts]
odoo-mcp = "odoo_mcp.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["odoo_mcp"]

[tool.setuptools.package-data]
odoo_mcp = ["data/*.json"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Tool modules annotate protocol-level response models (typed MCP outputSchema)
# while the functions keep returning the plain-dict envelope MCPServer validates
# at the MCP layer; the runtime dict/model mismatch is deliberate.
[[tool.mypy.overrides]]
module = [
    "odoo_mcp.tools_read",
    "odoo_mcp.tools_diagnostics",
    "odoo_mcp.tools_accounting",
    "odoo_mcp.tools_async",
    "odoo_mcp.tools_cross_instance",
    "odoo_mcp.tools_knowledge",
]
disable_error_code = ["return-value"]
